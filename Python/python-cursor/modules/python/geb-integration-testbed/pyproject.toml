[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geb-integration-testbed"
version = "0.1.0"
description = "GEB integration testbed — IDB JSON and EAI XML contract validation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "jsonschema>=4.21",
    "lxml>=5.0",
    "Jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
geb-testbed = "geb_testbed.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
