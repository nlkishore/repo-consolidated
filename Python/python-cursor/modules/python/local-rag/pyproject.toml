[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag"
version = "0.1.0"
description = "Local Windows RAG over personal documents (Ollama + Chroma)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0.0",
    "tqdm>=4.66.0",
    "tabulate>=0.9.0",
    "xlrd>=2.0.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40.0"]

[project.scripts]
local-rag = "local_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
