[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testbed"
version = "0.1.0"
description = "Corporate banking testbed — seed/validate GEB Company/Entity/User/Group/Role/Permission"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "mysql-connector-python>=8.3",
    "Faker>=24.0",
    "Jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
testbed = "testbed.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
